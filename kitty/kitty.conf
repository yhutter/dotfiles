include ~/.config/kitty/themes/gruvbox_light_hard.conf

font_family JetBrainsMono Nerd Font
bold_font auto
italic_font auto
bold_italic_font auto

font_size 12.0

map ctrl+shift+dot change_font_size all +2.0
map ctrl+shift+minus change_font_size all -2.0
map ctrl+shift+comma change_font_size all 0
map ctrl+shift+t new_tab_with_cwd
